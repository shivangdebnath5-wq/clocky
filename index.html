<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fx" aria-hidden="true"></div>

<div class="picker" id="picker">
  <button class="pick-btn" id="pickBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose theme">
    <span class="dot" id="pickDot"></span><span id="pickName">Sakura</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <ul class="pick-menu" id="pickMenu" role="listbox" aria-label="Themes" hidden></ul>
</div>

<main class="card">
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="clock" aria-selected="true">Clock</button>
    <button role="tab" data-tab="alarm" aria-selected="false">Alarms</button>
    <button role="tab" data-tab="timer" aria-selected="false">Timer</button>
    <button role="tab" data-tab="stopwatch" aria-selected="false">Stopwatch</button>
  </nav>

  <section class="pane" id="tab-clock">
    <div class="big" id="clock"></div>
    <div class="sub" id="dateText"></div>
    <button class="chip" id="fmtBtn">Switch to 24-hour</button>
  </section>

  <section class="pane" id="tab-alarm" hidden>
    <div class="row add">
      <input type="time" id="aTime" value="07:00" aria-label="Alarm time">
      <input type="text" id="aLabel" placeholder="Label (optional)" maxlength="30" aria-label="Alarm label">
    </div>
    <div class="row between">
      <label class="check"><input type="checkbox" id="aDaily"> Repeat daily</label>
      <button class="btn primary" id="aAdd">Add alarm</button>
    </div>
    <ul class="list" id="alarmList"></ul>
  </section>

  <section class="pane" id="tab-timer" hidden>
    <div id="timerSet">
      <div class="row hms">
        <label>Hours<input type="number" id="th" min="0" max="99" value="0"></label>
        <label>Minutes<input type="number" id="tm" min="0" max="59" value="5"></label>
        <label>Seconds<input type="number" id="ts" min="0" max="59" value="0"></label>
      </div>
      <div class="row presets">
        <button class="chip" data-p="60">1 min</button>
        <button class="chip" data-p="300">5 min</button>
        <button class="chip" data-p="600">10 min</button>
        <button class="chip" data-p="1500">25 min</button>
      </div>
    </div>
    <div id="timerShow" hidden>
      <div class="big" id="tDisp">00:05:00</div>
      <div class="bar"><i id="tBar"></i></div>
    </div>
    <div class="row">
      <button class="btn" id="tReset">Reset</button>
      <button class="btn primary" id="tStart">Start</button>
    </div>
  </section>

  <section class="pane" id="tab-stopwatch" hidden>
    <div class="big" id="swDisp">00:00.00</div>
    <div class="row">
      <button class="btn" id="swLap" disabled>Lap</button>
      <button class="btn primary" id="swStart">Start</button>
      <button class="btn" id="swReset">Reset</button>
    </div>
    <ol class="list laps" id="lapList"></ol>
  </section>
</main>

<div class="ring" id="ring" hidden role="alertdialog" aria-labelledby="ringTitle">
  <div class="ring-box">
    <h2 id="ringTitle">Alarm</h2>
    <p id="ringSub"></p>
    <div class="row">
      <button class="btn" id="snooze">Snooze 5 min</button>
      <button class="btn primary" id="dismiss">Dismiss</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
